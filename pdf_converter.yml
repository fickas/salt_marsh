name: Convert Markdown to PDF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert Markdown to PDF
        uses: ./ # Uses the action from this repo
        with:
          markdown-file: epa_final_report_draft.md
          output-file: epa_final_report_draft.pdf
          title: Detecting Eroding Salt Marsh Banks

      - name: Commit PDF back to repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f epa_final_report_draft.pdf ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add epa_final_report_draft.pdf
            git commit -m "Generate PDF from epa_final_report_draft.md via GitHub Actions" || echo "No changes to commit"
            git push
          else
            echo "PDF not found; skipping commit"
          fi
